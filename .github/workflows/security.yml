name: security extension against SDEM

# The security extension's tests, run against SDEM installed from its release tag and from main — never skipped
# (SDEM_REQUIRED=1): the review's finding A, compatibility shown on a clean install, not assumed.
on:
  push:
    paths: ['metamodel/security/**', '.github/workflows/security.yml']
  pull_request:
    paths: ['metamodel/security/**', '.github/workflows/security.yml']
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        sdem: [v0.19.0, v0.20.0, main]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SDEM at ${{ matrix.sdem }}, then the security extension, in one clean environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/taumoeps/bian-sdem-framework@${{ matrix.sdem }}"
          python -m pip install ./metamodel/security
          sdem --version
          sdem extensions
      - name: Switch it on in a fresh workspace and run every command
        shell: bash
        run: |
          W="$RUNNER_TEMP/ws"
          sdem new --workspace "$W" --person ci.check --example payment-initiation
          sdem profile include ext:security --workspace "$W" --person ci.check --reason "CI"
          sdem profile adopt --workspace "$W" --person ci.check --reason "CI"
          sdem check --workspace "$W"
          sdem security catalogue at rest
          sdem security coverage --workspace "$W"
          sdem security threats --workspace "$W"
          sdem security review --workspace "$W"
      - name: The extension's tests (SDEM required — none skipped)
        env:
          SDEM_REQUIRED: '1'
        run: python -m unittest discover -s metamodel/security/tests -v
