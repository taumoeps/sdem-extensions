[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sdem-desnre"
version = "0.11.11"
description = "An SDEM extension: puts a made-up SDEM workspace on the DESNRE site's 3D view (sdem desnre create / publish)"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
readme = "README.md"
dependencies = []

[project.urls]
Homepage = "https://github.com/taumoeps/sdem-extensions/tree/main/publishers/desnre"

[project.scripts]
sdem-desnre = "sdem_desnre:entry"

[tool.setuptools]
packages = ["sdem_desnre"]

[tool.setuptools.package-data]
sdem_desnre = ["*.json"]
