name: Test extensions
on:
  push:
  pull_request:
jobs:
  test:   # every extension against SDEM's made-up examples (EXT-14)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']   # as SDEM's own CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: taumoeps/sdem
          path: sdem
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install SDEM and the extensions
        run: |
          pip install ./sdem
          pip install ./publishers/desnre ./templates/publisher
          pip install ./metamodel/bian   # SDEM 0.22, R-D2: the banking designs the publisher is tested on use BIAN
          sdem extensions
      - name: Tests
        env:
          SDEM_HOME: ${{ github.workspace }}/sdem
        run: |
          python -m unittest discover -s publishers/desnre/tests -v
          python -m unittest discover -s templates/publisher/tests -v
