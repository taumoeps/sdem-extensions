name: security extension against SDEM

# The security extension's tests, run against SDEM installed from its release tag and from main — never skipped
# (SDEM_REQUIRED=1): the review's finding A, compatibility shown on a clean install, not assumed.
on:
  push:
    paths: ['metamodel/security/**', '.github/workflows/security.yml']
  pull_request:
    paths: ['metamodel/security/**', '.github/workflows/security.yml']
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        sdem: [v0.19.0, v0.20.0, main]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SDEM at ${{ matrix.sdem }}, then the security extension, in one clean environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/taumoeps/bian-sdem-framework@${{ matrix.sdem }}"
          python -m pip install ./metamodel/security
          sdem --version
          sdem extensions
      - name: Switch it on in a fresh workspace and run every command
        shell: bash
        run: |
          W="$RUNNER_TEMP/ws"
          sdem new --workspace "$W" --person ci.check --example payment-initiation
          sdem profile include ext:security --workspace "$W" --person ci.check --reason "CI"
          sdem profile adopt --workspace "$W" --person ci.check --reason "CI"
          sdem check --workspace "$W"
          sdem security catalogue at rest
          sdem security coverage --workspace "$W"
          sdem security threats --workspace "$W"
          sdem security review --workspace "$W"
      - name: The extension's tests (SDEM required — none skipped)
        env:
          SDEM_REQUIRED: '1'
        run: python -m unittest discover -s metamodel/security/tests -v

  stable-core:
    # The stable core with security in it (the owner, 2026-11-21): SDEM's tests/test_core_stability.py — the core identical with no
    # extension, with BIAN, with BIAN and security, and after each is removed — run where sdem-security is installed, so its steps run
    # (SDEM's own CI has no security). taken from SDEM main.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: taumoeps/bian-sdem-framework
          ref: main
          path: sdem-src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SDEM and the security extension in one clean environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./sdem-src ./metamodel/security
          sdem extensions
      - name: The stable core — security's steps must run, not skip
        shell: bash
        run: |
          cd sdem-src
          python -c "import subprocess, sys; out = subprocess.run([sys.executable, '-m', 'sdem', 'extensions'], capture_output=True, text=True).stdout; assert 'security' in out, out"
          python -m unittest tests.test_core_stability -v
